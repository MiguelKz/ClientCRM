<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClientCRM – Gerenciador de clientes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="logo">C</span> ClientCRM</div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="btn ghost sm" id="btn-export">⬇ Exportar backup</button>
      <button class="btn ghost sm" id="btn-import">⬆ Importar backup</button>
      <input type="file" id="file-import" accept="application/json" hidden>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menu-toggle" aria-label="Menu">☰</button>
      <h1 id="page-title"></h1>
      <div id="page-actions"></div>
    </header>
    <main id="view"></main>
  </div>

  <div id="toasts"></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
